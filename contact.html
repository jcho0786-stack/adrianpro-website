<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>문의 | 에이드리안프로</title>
<meta name="description" content="라미네이트 튜브 견적 문의 · 연락처 · 오시는 길">

<link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png">

<meta property="og:title" content="문의 | 에이드리안프로">
<meta property="og:description" content="라미네이트 튜브 견적 문의 · 연락처 · 오시는 길">
<meta property="og:url" content="https://www.adrianpro.co.kr/contact.html">

</head>
<body>
<header id="site-header"></header>
<main>
  <div class="page-hero">
    <div class="wrap reveal">
      <div class="crumbs"><a href="index.html">HOME</a><span>/</span><span>CONTACT</span></div>
      <h1>견적·사양 문의</h1>
      <p class="lead">아래 양식을 작성해 주시면 담당자가 확인 후 연락드립니다.</p>
    </div>
  </div>

  <section id="rfq">
    <div class="wrap split contact-split">
      <form class="panel form reveal" id="rfq-form" novalidate>
        <input type="text" name="_honey" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
        <div class="field"><label for="company">회사명<span class="req">*</span></label><input id="company" name="company" required autocomplete="organization"></div>
        <div class="field"><label for="name">담당자<span class="req">*</span></label><input id="name" name="name" required autocomplete="name"></div>
        <div class="field"><label for="phone">연락처<span class="req">*</span></label><input id="phone" name="phone" type="tel" required autocomplete="tel" placeholder="010-0000-0000"></div>
        <div class="field"><label for="email">이메일<span class="req">*</span></label><input id="email" name="email" type="email" required autocomplete="email"></div>
        <div class="field full">
          <label>문의 유형</label>
          <div class="check-group">
            <label><input type="checkbox" name="type" value="ABL 튜브"><span>ABL 튜브</span></label>
            <label><input type="checkbox" name="type" value="PBL 튜브"><span>PBL 튜브</span></label>
            <label><input type="checkbox" name="type" value="샘플 요청"><span>샘플 요청</span></label>
            <label><input type="checkbox" name="type" value="공장 방문"><span>공장 방문</span></label>
            <label><input type="checkbox" name="type" value="기타"><span>기타</span></label>
          </div>
        </div>
        <div class="field full"><label for="diameter">튜브 직경</label>
          <select id="diameter" name="diameter">
            <option value="">선택 / 미정</option><option>Ø13.7–19 mm</option><option>Ø22–25 mm</option><option>Ø28–30 mm</option><option>Ø35–40 mm</option><option>Ø45–60 mm</option><option>상담 필요</option>
          </select></div>
        <div class="field full"><label for="message">문의 내용</label><textarea id="message" name="message" placeholder="내용물 종류, 용량, 인쇄 도수 등 알고 계신 정보를 자유롭게 적어 주세요."></textarea></div>
        <div class="field full" style="grid-template-columns:auto 1fr;align-items:start;gap:10px">
          <input type="checkbox" id="agree" required style="width:18px;height:18px;margin-top:3px;accent-color:var(--ink)">
          <label for="agree" style="font-weight:400;font-size:14px;color:var(--ink-2)">문의 응대를 위한 개인정보(회사명, 담당자, 연락처, 이메일) 수집·이용에 동의합니다. 수집된 정보는 문의 처리 후 관련 법령에 따라 보관·파기됩니다. <a href="privacy.html" target="_blank" style="color:var(--copper);text-decoration:underline">개인정보처리방침 보기</a><span class="req">*</span></label>
        </div>
        <div class="field full" style="display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap">
          <span class="form-note">* 필수 항목</span>
          <button class="btn btn-primary" type="submit">문의 보내기 <span class="arrow">→</span></button>
        </div>
        <div class="form-status" id="form-status" role="status" aria-live="polite"></div>
      </form>

      <div class="reveal">
        <dl class="contact-info">
          <div class="row"><dt>전화</dt><dd><a class="mono" href="tel:0437507073" style="font-size:20px" data-co="tel"></a></dd></div>
          <div class="row"><dt>팩스</dt><dd class="mono" data-co="fax"></dd></div>
          <div class="row"><dt>이메일</dt><dd><a href="mailto:john@adrianpro.co.kr" style="color:var(--copper);font-weight:600">john@adrianpro.co.kr</a></dd></div>
          <div class="row"><dt>주소</dt><dd><span data-co="addrKo"></span><br><span style="font-size:13px;color:var(--ink-3)" data-co="addrEn"></span></dd></div>
          <div class="row"><dt>상담 시간</dt><dd>평일 08:30 – 17:30 <span style="color:var(--ink-3)">(주말·공휴일 휴무)</span></dd></div>
        </dl>
        <div class="map-box">
          <iframe title="에이드리안프로 위치" loading="lazy" referrerpolicy="no-referrer-when-downgrade"
            src="https://maps.google.com/maps?q=%EC%B6%A9%EC%B2%AD%EB%B6%81%EB%8F%84%20%EC%9D%8C%EC%84%B1%EA%B5%B0%20%EA%B8%88%EC%99%95%EC%9D%8D%20%EA%B8%88%EC%9D%BC%EB%A1%9C284%EB%B2%88%EA%B8%B8%2023-5&z=15&output=embed"></iframe>
        </div>
      </div>
    </div>
  </section>
</main>
<footer id="site-footer"></footer>
<script src="assets/main.js"></script>
</body>
</html>
